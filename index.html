<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Tactics Test Sim</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Football Tactics <span class="accent">Test Sim</span></h1>
    <div class="topbar-opts">
      <label><input type="checkbox" id="toggleResp" checked /> Show responsibilities on pitch</label>
      <label><input type="checkbox" id="toggleWeather" /> Bad weather</label>
      <a href="https://gorstak.eu" target="_blank" rel="noopener">gorstak.eu</a>
    </div>
  </header>

  <main class="layout">
    <section class="panel" id="panelA"></section>

    <section class="center">
      <canvas id="pitch" width="620" height="820"></canvas>
      <div id="timeline"></div>
      <p class="hint">
        Team A attacks right, Team B attacks left. Dots show position code,
        role (duty) and — per your guide's rule 8 tables — each player's
        resolved responsibility for the chosen fluidity &amp; mentality.
      </p>
    </section>

    <section class="panel" id="panelB"></section>
  </main>

  <!-- Data + engine (order matters) -->
  <script src="js/formations.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/responsibilities.js"></script>
  <script src="js/responsibilities-data2.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/pitch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
